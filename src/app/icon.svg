<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="odonto-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="wire-grad" x1="4" y1="16" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93C5FD" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#5EEAD4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="1" y="1" width="30" height="30" rx="8" fill="url(#odonto-grad)" />
  <rect x="1.5" y="1.5" width="29" height="29" rx="7.5" stroke="rgba(255,255,255,0.25)" stroke-width="1" />

  <!-- Stylized Tooth Silhouette -->
  <path d="M10 9 C7.5 9 6.5 12 7 16 C7.5 20 8.5 24.5 11 24.5 C12.5 24.5 13 22 14.5 22 C16 22 16 24.5 17.5 24.5 C20 24.5 21 20 21.5 16 C22 12 21 9 18.5 9 C16.5 9 16 11 14.25 11 C12.5 11 12 9 10 9 Z" 
        fill="#FFFFFF" 
        fill-opacity="0.95" 
        transform="translate(1.75, 0)" />

  <!-- Orthodontic Archwire Curve across Crown -->
  <path d="M6 16.5 Q 16 19.5 26 16.5" 
        stroke="url(#wire-grad)" 
        stroke-width="2" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <!-- Orthodontic Precision Bracket Nodes -->
  <rect x="11.5" y="15" width="3" height="3" rx="0.75" fill="#1E3A8A" stroke="#93C5FD" stroke-width="0.75" />
  <rect x="17.5" y="15" width="3" height="3" rx="0.75" fill="#1E3A8A" stroke="#5EEAD4" stroke-width="0.75" />

  <!-- AI Biomechanical Sparkle Accent -->
  <path d="M23 7.5 L24 9.5 L26 10.5 L24 11.5 L23 13.5 L22 11.5 L20 10.5 L22 9.5 Z" fill="#FDE047" opacity="0.9" />
</svg>
